[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "django-timeline-logger"
version = "6.0.0"
description = "Generic event logger for Django models."
authors = [
    {name = "Maykin Media", email = "support@maykinmedia.nl"}
]
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["django", "generic logging"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.12"
dependencies = [
    "django>=4.2",
    "django-appconf",
    "typing-extensions",
]

[project.urls]
Homepage = "https://github.com/maykinmedia/django-timeline-logger"
Documentation = "http://django-timeline-logger.readthedocs.io/en/latest/"
"Bug Tracker" = "https://github.com/maykinmedia/django-timeline-logger/issues"
"Source Code" = "https://github.com/maykinmedia/django-timeline-logger"
Changelog = "https://github.com/maykinmedia/django-timeline-logger/blob/master/docs/changelog.rst"

[project.optional-dependencies]
tests = [
    "factory-boy",
    "time-machine",
    "psycopg",
    "pytest",
    "pytest-cov",
    "pytest-env",
    "pytest-django",
    "tox",
    "ruff",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
]
release = [
    "bump-my-version",
]

[tool.setuptools.packages.find]
include = ["timeline_logger*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "tests.settings_pg"
markers = [
    "real_db_close: do not patch timeline_logger.handlers.close_old_connections",
]
env = [
    "_TIMELINE_LOGGER_DEFER_LISTENER=true",
]

[tool.bumpversion]
current_version = "6.0.0"
files = [
    {filename = "pyproject.toml"},
]

[tool.coverage.run]
branch = true
source = [
    "timeline_logger"
]
omit = [
    "demo/*",
    "*/migrations/*",
    "*/tests/*",
]

[tool.coverage.report]
exclude_also = [
    "if (typing\\.)?TYPE_CHECKING:",
    "@(typing\\.)?overload",
    "class .*\\(.*Protocol.*\\):",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
    "\\.\\.\\.",
    "\\bpass$",
]
omit = [
    "demo/*",
    "*/migrations/*",
    "*/tests/*",
]

[tool.ruff.lint]
extend-select = [
    "UP",  # pyupgrade
    "DJ",  # django
    "LOG", # logging
    "G",
    "I",   # isort
    "E",   # pycodestyle
    "F",   # pyflakes
    "PERF",# perflint
    "B",   # flake8-bugbear
]

[tool.ruff.lint.isort]
combine-as-imports = true
section-order = [
    "future",
    "standard-library",
    "django",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
"django" = ["django"]
